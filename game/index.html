<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ember Orbit — a gravity-slingshot arcade game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <canvas id="game" width="1280" height="720"></canvas>
      <p class="hint">
        Drag back from the ember to aim, release to launch · Click mid-flight to bank shards ·
        R restart · M mute · Enter to continue
      </p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
